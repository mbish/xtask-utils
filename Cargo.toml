[package]
name = "xtask-utils"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0.215", features = ["serde_derive"] }
serde_json = "1.0.134"
xshell = "0.2.7"
tempfile = "3.15.0"
anyhow = "1.0.100"
strum = { version = "0.28.0", features = ["derive"] }
which = "8.0.6"
chrono = { version = "0.4.44", default-features = false, features = ["serde", "clock"] }
yaml-rust2 = "0.13.0"
